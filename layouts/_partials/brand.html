{{- $d := hugo.Data.site -}}
<a class="brand{{ with .class }} {{ . }}{{ end }}" href="{{ "/" | relURL }}#top" aria-label="{{ $d.company.name }} {{ $d.company.tagline }} — на головну">
  <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true">
    <rect width="40" height="40" rx="10" fill="currentColor"/>
    <g stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M20 8v24M9.6 14l20.8 12M9.6 26l20.8-12"/>
      <path d="M16.5 9.8 20 13l3.5-3.2M16.5 30.2 20 27l3.5 3.2"/>
    </g>
  </svg>
  <span class="brand__text"><strong>{{ $d.company.name }}</strong><span>{{ $d.company.tagline }}</span></span>
</a>
