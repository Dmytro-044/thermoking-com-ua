faq:
  - q: "Як часто потрібно робити ТО холодильної установки?"
    a: "Інтервал залежить від моделі й умов експлуатації та визначається регламентом виробника за мотогодинами. Ми складемо графік ТО для вашого автопарку й нагадаємо про наступний візит."
  - q: "Що таке ATP і коли його продовжувати?"
    a: "ATP — міжнародна угода про перевезення швидкопсувних харчових продуктів. Свідоцтво має обмежений строк дії, тож установку періодично потрібно випробовувати. Ми підготуємо обладнання й допоможемо з документами."
  - q: "Чи можете ви приїхати до нас на базу?"
    a: "Так. Мобільний сервіс виконує ТО та частину ремонтів на вашій території. Залиште заявку з адресою — ми погодимо час і вартість виїзду."
  - q: "Чи обслуговуєте ви обладнання Frigoblock?"
    a: "Так, ми виконуємо сервіс і ремонт систем Frigoblock."
  - q: "Скільки часу займає ремонт?"
    a: "Після діагностики ми називаємо строки й вартість. Типові роботи з деталями в наявності зазвичай виконуємо в день звернення."
